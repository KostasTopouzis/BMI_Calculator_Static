<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BMI Calculator Login Page">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link rel="manifest" href="../assets/images/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <title>Login | BMI Calculator</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- The element implements the aside navbar panel -->
    <aside id="options-panel" class="options-panel" aria-hidden="true">
        <nav class="d-flex flex-row flex-md-column gap-2 p-3" aria-label="Page options">
            <a class="btn btn-primary text-center" href="/index.html">Home</a>
            <a class="btn btn-primary text-center" href="login.html">Log in</a>
        </nav>
    </aside>
    
    <header class="container-fluid py-5 text-center">
        <h1>BMI Calculator</h1>
        <p>Create an account to save your measurements</p>
    </header>

    <main id="content" class="container flex-grow-1 d-flex justify-content-center align-items-start">
        <form id="signup-form" class="col-11 col-sm-8 col-md-6 col-lg-4 border rounded px-4 py-4">
            <fieldset>
                <legend class="text-center mb-4">Sign up</legend>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <span id="signup-usr-error-message" class="error-message"></span>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <span id="signup-pwd-error-message" class="error-message"></span>
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign up</button>
            </fieldset>
        </form>

        <div id="signup-general-error-message" class="error-message mt-3"></div>
    </main>

    <footer class="bg-dark p-3 border-top">
        <div class="container-fluid">
            <div class="row d-flex flex-column flex-md-row justify-content-around">
                <div class="col-md-4 col-lg-5 text-center text-white">
                    Made with Bootstrap 5.3.8. Icons by
                    <a href="https://icons8.com/" class="link-light link-underline-opacity-50 link-underline-opacity-100-hover footer-link">Icons8</a>
                </div>

                <div class="col-md-3 col-lg-2"></div>

                <div class="col-md-4 d-flex flex-column gap-1 gap-sm-2 align-items-center align-items-md-end mt-2 mt-md-0 text-light">
                    <span class="d-flex align-items-center gap-2">
                        Find me on
                        <a href="https://github.com/KostasTopouzis" class="link-light link-underline-opacity-50 link-underline-opacity-100-hover" aria-label="GitHub">GitHub</a>
                        <img src="../assets/images/icons8-github-96.jpg" width="28" height="28" alt="GitHub icon">
                    </span>
                    <span class="d-flex align-items-center gap-2">
                        Follow me on
                        <a href="https://www.linkedin.com/" class="link-light link-underline-opacity-50 link-underline-opacity-100-hover footer-link" aria-label="LinkedIn">LinkedIn</a>
                        <img src="../assets/images/icons8-linkedin-96.svg" width="30" height="30" alt="LinkedIn icon">
                    </span>
                </div>

                <div class="col-md-1"></div>
            </div>
        </div>
    </footer>

    <script type="module" defer src="../js/auxiliary.js"></script>
    <script type="module" defer src="../js/signup.js"></script>
</body>
</html>
